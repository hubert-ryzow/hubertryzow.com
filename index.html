<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubert Ryzow — Under Construction</title>
  <meta name="description" content="Hubert Ryzow's website is under construction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #07050b;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* black background with a soft purple glow */
    .glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(110, 60, 180, 0.28), transparent 70%),
        radial-gradient(ellipse 40% 35% at 80% 90%, rgba(80, 30, 140, 0.18), transparent 70%),
        radial-gradient(ellipse 35% 30% at 15% 10%, rgba(90, 40, 160, 0.15), transparent 70%);
      animation: breathe 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes breathe {
      from { opacity: 0.75; transform: scale(1); }
      to   { opacity: 1;    transform: scale(1.06); }
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    main {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
      pointer-events: none;
    }

    .tag {
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 1.6vw, 0.9rem);
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: rise 1s ease-out 0.2s forwards;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(2.6rem, 9vw, 7rem);
      line-height: 1;
      letter-spacing: -0.03em;
      text-shadow: 0 0 40px rgba(160, 110, 255, 0.35);
      opacity: 0;
      animation: rise 1.1s ease-out 0.4s forwards;
    }

    p {
      margin-top: 1.6rem;
      font-weight: 300;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      animation: rise 1s ease-out 0.7s forwards;
    }

    a {
      pointer-events: auto;
      display: inline-block;
      margin-top: 2.4rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(6px);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      opacity: 0;
      animation: rise 1s ease-out 1s forwards;
    }

    a:hover {
      background: rgba(150, 100, 255, 0.15);
      border-color: rgba(180, 140, 255, 0.6);
      box-shadow: 0 0 24px rgba(150, 100, 255, 0.35);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow, .tag, h1, p, a { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <canvas id="stars"></canvas>

  <main>
    <div class="tag">hubertryzow.com</div>
    <h1>Under construction</h1>
    <p>Something new is being built here. Check back soon.</p>
    <a href="mailto:hello@hubertryzow.com">hello@hubertryzow.com</a>
  </main>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let w, h, dpr, dots = [];
    // where the mouse is (from -1 to 1), and a smoothed version of it
    const mouse = { x: 0, y: 0 };
    const smooth = { x: 0, y: 0 };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeDots();
    }

    function makeDots() {
      const count = Math.round((w * h) / 6000);
      dots = [];
      for (let i = 0; i < count; i++) {
        const depth = Math.random();           // 0 = far away, 1 = close
        dots.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.4 + depth * 1.6,                // closer dots are bigger
          depth,
          vx: (Math.random() - 0.5) * 0.08,     // slow drift
          vy: (Math.random() - 0.5) * 0.08,
          phase: Math.random() * Math.PI * 2,   // for twinkling
          speed: 0.5 + Math.random() * 1.5
        });
      }
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);

      // ease towards the mouse so movement feels smooth
      smooth.x += (mouse.x - smooth.x) * 0.05;
      smooth.y += (mouse.y - smooth.y) * 0.05;

      for (const d of dots) {
        if (!reduceMotion) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.x < -10) d.x = w + 10;
          if (d.x > w + 10) d.x = -10;
          if (d.y < -10) d.y = h + 10;
          if (d.y > h + 10) d.y = -10;
        }

        // parallax: closer dots move more with the mouse
        const shift = 10 + d.depth * 50;
        const x = d.x - smooth.x * shift;
        const y = d.y - smooth.y * shift;

        const twinkle = reduceMotion ? 1 : 0.6 + 0.4 * Math.sin(t * 0.001 * d.speed + d.phase);
        const alpha = (0.25 + d.depth * 0.75) * twinkle;

        ctx.beginPath();
        ctx.arc(x, y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();

        // a soft purple halo around the biggest dots
        if (d.depth > 0.85) {
          ctx.beginPath();
          ctx.arc(x, y, d.r * 4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(170, 130, 255, ${alpha * 0.12})`;
          ctx.fill();
        }
      }

      requestAnimationFrame(draw);
    }

    function setPointer(clientX, clientY) {
      mouse.x = (clientX / w) * 2 - 1;
      mouse.y = (clientY / h) * 2 - 1;
    }

    window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      if (touch) setPointer(touch.clientX, touch.clientY);
    }, { passive: true });
    window.addEventListener('mouseleave', () => { mouse.x = 0; mouse.y = 0; });
    window.addEventListener('resize', resize);

    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
